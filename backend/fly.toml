# fly.toml app configuration file generated for OCI Converge backend.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# First-time setup:
#   cd backend && fly launch --copy-config --name oci-backend --no-deploy
# Then:
#   fly deploy

app = "oci-backend"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
