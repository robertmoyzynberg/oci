# Root Render Blueprint (monorepo). Uses backend/ as the service root.
name: oci-backend-blueprint
services:
  - type: web
    name: oci-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
